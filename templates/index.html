<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyMate AI — Physics</title>
<style>
:root {
    --bg:#07111f; --panel:#0d1b2d; --card:#10243a; --line:#1d344d;
    --text:#e9f1fb; --muted:#91a5ba; --accent:#63e6be; --blue:#60a5fa;
}
* { box-sizing:border-box; }
body {
    margin:0; min-height:100vh; color:var(--text);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    background:
      radial-gradient(circle at 15% 10%,rgba(96,165,250,.16),transparent 30%),
      radial-gradient(circle at 85% 90%,rgba(99,230,190,.10),transparent 30%),var(--bg);
}
.shell {
    width:min(1100px,94vw); height:min(90vh,850px); margin:5vh auto;
    display:flex; flex-direction:column; overflow:hidden;
    background:rgba(13,27,45,.84); border:1px solid var(--line);
    border-radius:28px; box-shadow:0 25px 80px rgba(0,0,0,.35);
    backdrop-filter:blur(20px);
}
header {
    min-height:78px; padding:18px 26px; display:flex; align-items:center;
    justify-content:space-between; border-bottom:1px solid var(--line);
}
.brand { display:flex; align-items:center; gap:13px; }
.logo {
    width:43px; height:43px; display:grid; place-items:center; border-radius:14px;
    background:linear-gradient(135deg,var(--accent),var(--blue)); color:#06111c; font-weight:900;
}
h1 { margin:0; font-size:18px; }
.sub { color:var(--muted); font-size:11px; margin-top:3px; }
.badge {
    padding:7px 10px; border:1px solid rgba(99,230,190,.2);
    border-radius:999px; color:var(--accent); font-size:11px;
}
.chat { flex:1; overflow-y:auto; padding:35px clamp(18px,7vw,75px); }
.welcome { max-width:680px; margin:7vh auto 35px; text-align:center; }
.welcome .pill { color:var(--accent); font-size:11px; }
.welcome h2 { font-size:clamp(30px,5vw,48px); letter-spacing:-.05em; line-height:1.03; margin:12px 0; }
.welcome p { color:var(--muted); line-height:1.65; }
.message { max-width:800px; margin:0 auto 20px; display:flex; gap:11px; }
.message.user { justify-content:flex-end; }
.avatar {
    flex:0 0 32px; width:32px; height:32px; border-radius:11px;
    display:grid; place-items:center; background:#16304b; color:var(--accent); font-size:11px;
}
.user .avatar { order:2; color:#c8e3ff; }
.bubble {
    max-width:82%; padding:14px 16px; border-radius:17px 17px 17px 5px;
    background:var(--card); border:1px solid var(--line);
    line-height:1.65; font-size:14px; white-space:pre-wrap; overflow-wrap:anywhere;
}
.user .bubble { border-radius:17px 17px 5px 17px; background:#173b5e; }
.composer-wrap { padding:15px clamp(18px,7vw,75px) 20px; border-top:1px solid var(--line); }
form {
    max-width:800px; margin:auto; display:flex; gap:9px; align-items:flex-end;
    padding:9px; border:1px solid var(--line); border-radius:18px; background:#0b1a2b;
}
textarea {
    flex:1; min-height:44px; max-height:130px; resize:none; outline:none; border:0;
    background:transparent; color:var(--text); padding:10px 8px; font:inherit;
}
textarea::placeholder { color:#62778e; }
button {
    border:0; cursor:pointer;
}
.send {
    width:44px; height:44px; border-radius:13px;
    background:linear-gradient(135deg,var(--accent),var(--blue)); color:#06111c;
    font-size:18px; font-weight:900;
}
.send:disabled { opacity:.45; cursor:not-allowed; }
.note { text-align:center; color:#5e7288; font-size:10px; margin-top:8px; }
.clear { color:var(--muted); background:transparent; font-size:12px; }
.clear:hover { color:var(--text); }
@media(max-width:650px) {
    .shell { width:100%; height:100vh; margin:0; border-radius:0; }
    .badge { display:none; }
}
</style>
</head>
<body>
<div class="shell">
<header>
  <div class="brand">
    <div class="logo">✦</div>
    <div><h1>StudyMate AI</h1><div class="sub">Physics Study Assistant</div></div>
  </div>
  <div>
    <span class="badge">Physics only</span>
    <button class="clear" id="clear">Clear</button>
  </div>
</header>

<section class="chat" id="chat">
  <div class="welcome" id="welcome">
    <div class="pill">FOCUSED LEARNING SPACE</div>
    <h2>Master Physics.<br>One question at a time.</h2>
    <p>Ask for explanations, step-by-step solutions, revision notes, examples, or practice questions in Physics.</p>
  </div>
</section>

<div class="composer-wrap">
<form id="form">
  <textarea id="input" rows="1" placeholder="Ask a Physics study question..."></textarea>
  <button class="send" id="send" type="submit">↑</button>
</form>
<div class="note">StudyMate AI answers Physics-related academic questions only.</div>
</div>
</div>

<script>
const chat=document.getElementById("chat");
const form=document.getElementById("form");
const input=document.getElementById("input");
const send=document.getElementById("send");
const clear=document.getElementById("clear");
let history=[];

function add(role,text){
  document.getElementById("welcome")?.remove();
  const row=document.createElement("div");
  row.className="message "+role;
  const av=document.createElement("div");
  av.className="avatar"; av.textContent=role==="user"?"YOU":"✦";
  const bubble=document.createElement("div");
  bubble.className="bubble"; bubble.textContent=text;
  row.append(av,bubble); chat.appendChild(row); chat.scrollTop=chat.scrollHeight;
}

function typing(){
  const row=document.createElement("div"); row.className="message"; row.id="typing";
  const av=document.createElement("div"); av.className="avatar"; av.textContent="✦";
  const bubble=document.createElement("div"); bubble.className="bubble"; bubble.textContent="Thinking...";
  row.append(av,bubble); chat.appendChild(row); chat.scrollTop=chat.scrollHeight;
}

form.addEventListener("submit",async(e)=>{
  e.preventDefault();
  const text=input.value.trim(); if(!text||send.disabled)return;
  add("user",text); history.push({role:"user",content:text});
  input.value=""; input.style.height="auto"; send.disabled=true; typing();
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text,history:history.slice(-12)})});
    const data=await r.json(); document.getElementById("typing")?.remove();
    if(!r.ok)throw new Error(data.error);
    add("model",data.answer); history.push({role:"model",content:data.answer});
  }catch(err){
    document.getElementById("typing")?.remove();
    add("model","Sorry, something went wrong. Please check your Gemini API configuration and try again.");
  }finally{send.disabled=false;input.focus();}
});

input.addEventListener("input",()=>{
  input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,130)+"px";
});
input.addEventListener("keydown",(e)=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit();}
});
clear.addEventListener("click",()=>{
  history=[]; location.reload();
});
input.focus();
</script>
</body>
</html>
